# Configuration uniquement pour les tests.
# Elle evite de dependre de MySQL local et de DB_PASSWORD pendant mvn test.
spring.datasource.url=jdbc:h2:mem:autoloc_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate cree les tables au demarrage des tests et les supprime a la fin.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
