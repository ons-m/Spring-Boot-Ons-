spring.application.name=autoloc-api
server.servlet.context-path=/api

spring.datasource.url=jdbc:mysql://localhost:3306/autoloc_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
# Si DB_PASSWORD n'existe pas, Spring utilise une valeur vide.
# C'est le cas le plus courant avec MySQL/XAMPP en local.
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=true
springdoc.api-docs.version=OPENAPI_3_1
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.tn.esprit.autoloc=INFO
